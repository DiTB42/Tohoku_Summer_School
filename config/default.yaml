# Default configuration for the snake environment / CPG / SAC training.
# Values here reproduce the behavior that used to be hardcoded in
# env_snake.py, snake_cpg.py and train_sac.py. Override individual keys
# in a separate YAML (e.g. config/exp1.yaml) and pass it with --config.

reward:
  # 論文 (式12) の報酬は r1/r2/r3 の3項のみ。下の3重みは「学生が設計・調整する対象」
  # (docs/STUDENT_TASKS_JP.md 課題2)。r3 は罰則なので env 側で減算している。
  w_progress: 0           # r1: weight of 1/(0.1+distance)  (proximity attractor)
  w_velocity: 50.0          # r2: weight of closing speed (reduced so it no longer dominates)
  w_smoothness: 0         # r3: weight of action-change penalty (subtracted) → smoother gait
  waypoint_threshold: 0.4   # distance under which a waypoint/goal counts as reached
  # DELIBERATE DIVERGENCE from paper eq.(12) — reward reaching the goal, fast.
  # Guardrail: w_goal must stay >> time_penalty * max_episode_steps (0.05*250=12.5)
  # so stalling/crashing never beats finishing.
  w_goal: 100.0             # one-shot terminal bonus for reaching the goal
  time_penalty: 0.05        # per-step living cost → rewards finishing fast

cpg:
  frequency_hz: 50.0        # CPG update frequency for standalone use (dt = 1/frequency_hz)
  convergence_rate: 63.0    # a parameter
  coupling_strength: 3.0    # mu parameter
  base_amplitude: 0.4       # R (fixed action space runs)
  base_omega: 2.0           # omega (fixed action space runs)
  base_delta: 0.0           # delta (fixed action space runs)
  base_phase_shift: 0.52  # theta (pi/6)

training:
  algorithm: SAC
  learning_rate: 1.0e-3
  batch_size: 128
  buffer_size: 9000000
  tau: 0.005
  gamma: 0.95
  ent_coef: auto
  train_freq: [1, step]
  gradient_steps: 1
  # Parallel environments for data collection (SubprocVecEnv). 1 = single-env
  # (original behavior). Set to ~8 on this machine, or pass --n-envs 8, for
  # CPU-parallel training. gradient_steps is auto-scaled by n_envs at runtime.
  n_envs: 1
  total_timesteps: 1000000
  log_interval: 4
  tensorboard_log: sac_snake_tensorboard/
  model_save_path: models/sac_snake_final

env:
  cpg_frequency: 50
  rl_frequency: 0.2
  max_episode_steps: 250    # goal is now a fixed ~30-cell A* path; needs time to traverse
  maze_height: 10           # KEEP: corridor-only, see README Limitations
  maze_width: 10
  # 学生課題1 (行動空間 R⁴ 化, docs/STUDENT_TASKS_JP.md): 行動空間は
  # (R, ω, θ, δ) の4次元。各リストは [R, omega, theta, delta] の順。
  #   R     : joint amplitude (rad)
  #   omega : oscillation speed (rad/s)
  #   theta : phase shift between joints (rad)
  #   delta : joint offset (0 = straight, nonzero = turn)
  action_low:  [0.1, 1.7, 0.4, -0.1]
  action_high: [0.7, 2.3, 1,  0.1]
  # UNUSED: superseded by the fixed GOAL_PATH_LENGTH (=30 A* moves) in env_snake.py.
  # Kept only so existing configs don't break; the goal is now always exactly 30 A*
  # moves from the start (reset() regenerates the maze until such a cell exists).
  min_goal_distance: 2
